# Mahalliy yoki bitta serverga joylashtirish uchun namuna.
# Ishga tushirish: cp .env.example .env (qiymatlarni to‘ldiring) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ozbegim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni .env da belgilang}
      POSTGRES_DB: ozbegim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozbegim"]
      interval: 5s
      retries: 20

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ozbegim:${POSTGRES_PASSWORD}@db:5432/ozbegim?schema=public
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ozbegim:${POSTGRES_PASSWORD}@db:5432/ozbegim?schema=public
      STORAGE_LOCAL_DIR: /app/.data/storage
      FILE_PROCESSING: worker
      SKIP_MIGRATIONS: "1"
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/.data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ozbegim:${POSTGRES_PASSWORD}@db:5432/ozbegim?schema=public
      STORAGE_LOCAL_DIR: /app/.data/storage
    volumes:
      - storage:/app/.data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
